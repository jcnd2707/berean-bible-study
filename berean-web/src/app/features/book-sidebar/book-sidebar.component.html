<div class="sidebar">

  <div class="sb-label">Old Testament</div>
  <div class="book-scroll">
    @for (book of otBooks(); track book.number) {
      <div class="book-item" [class.active]="isActiveBook(book)"
           (click)="selectBook(book)">
        {{ book.name }}
        <span class="ch-count">{{ book.chapterCount }}</span>
      </div>
    }

    <div class="sb-divider"></div>

    <div class="sb-label sb-label--inline">New Testament</div>
    @for (book of ntBooks(); track book.number) {
      <div class="book-item" [class.active]="isActiveBook(book)"
           (click)="selectBook(book)">
        {{ book.name }}
        <span class="ch-count">{{ book.chapterCount }}</span>
      </div>
    }
  </div>

  @if (selectedBook()) {
    <div class="sb-divider"></div>
    <div class="sb-label">Chapter</div>
    <div class="ch-grid">
      @for (ch of chapterNumbers(); track ch) {
        <div class="ch" [class.active]="isActiveChapter(ch)"
             (click)="selectChapter(ch)">
          {{ ch }}
        </div>
      }
    </div>
  }

</div>
