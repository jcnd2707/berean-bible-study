name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Berean.sln

      - name: Build
        run: dotnet build Berean.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Berean.Core.Tests --no-build --configuration Release --logger "console;verbosity=normal"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: berean-web
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: berean-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit
